<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arnie's World of Music</title><meta name="description" content="Arnie's guitar performances, music calendar, and video library.">
<style>
*{box-sizing:border-box}body{margin:0;background:#06101d;color:#fff;font-family:Georgia,serif}a{color:inherit}
.desktop{position:relative;max-width:1671px;margin:auto}.art{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;border-radius:8px;outline-offset:2px}.hotspot:hover{box-shadow:inset 0 0 0 3px #ffe08a88;background:#fff1}.hotspot:focus-visible{outline:3px solid #fff}.nav-extension{z-index:2;display:flex;align-items:center;justify-content:center;color:#fff;background:transparent;text-decoration:none;font:700 clamp(12px,1.12vw,19px)/1 Arial,Helvetica,sans-serif;white-space:nowrap}.nav-extension:hover{color:#fff;background:#fff1;box-shadow:inset 0 0 0 3px #ffe08a88}

/* Homepage navigation now uses real links and the same Georgia/gold treatment as inner pages.
   The original homepage logo and artwork remain unchanged. */
.desktop-nav{position:absolute;z-index:5;left:46.4%;right:1.5%;top:0;height:8.29%;display:flex;align-items:center;justify-content:space-between;gap:.25%;font-family:Georgia,"Times New Roman",serif}
.desktop-nav a{min-width:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;padding:1.0% 1.1%;border-radius:7px;text-decoration:none;color:#fffaf0;font-size:clamp(10px,1.15vw,19px);font-weight:700;line-height:1.15;transition:background .16s ease,box-shadow .16s ease}
.desktop-nav a.current{color:#181006;background:linear-gradient(180deg,#fff1ad 0%,#f6d574 38%,#d09a2e 76%,#a86d16 100%);box-shadow:inset 0 1px 0 #fff8d4,inset 0 -1px 0 #71450d,0 5px 14px #000a}
.desktop-nav a:not(.current):hover,.desktop-nav a:not(.current):focus-visible{background:#07111d;box-shadow:inset 0 0 0 2px #f4cb65,0 4px 13px #0009}
.desktop-nav a:focus-visible{outline:2px solid #ffe08a;outline-offset:2px}

.mobile{display:none}.notice{margin:0;padding:clamp(16px,2vw,24px);background:#06101d;color:#d8ba68;font:400 clamp(14px,1vw,16px)/1.5 Georgia,serif;letter-spacing:.04em;text-align:center}
@media(max-width:767px){
.desktop{display:none}.mobile{display:block}.mobile header{height:65px;overflow:hidden;background:#060d17;border-bottom:1px solid #d6a63e;text-align:center}
.mobile header img{position:relative;left:50%;width:auto;height:65px;max-width:none;display:block;margin:0;transform:translateX(-283px)}.mobile nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:11px 8px;background:#0b1423}
.mobile nav a{min-width:0;min-height:50px;display:flex;align-items:center;justify-content:center;padding:8px 4px;border:1px solid #bd943d;border-radius:6px;font:600 clamp(11px,3vw,13px)/1.2 Arial,sans-serif;text-align:center;text-decoration:none;overflow-wrap:break-word}
.mobile .hero-image{width:100%;height:auto;display:block}
.mobile h2{text-align:center;color:#f8d57d;font-size:26px;margin:14px 10px 16px}
.mobile .cards{display:grid;grid-template-columns:1fr;gap:16px;padding:0 12px 30px}.mobile .card{position:relative;border:2px solid #e4b545;border-radius:16px;overflow:hidden}.mobile .card img{width:100%;height:auto;display:block}.mobile .card a{position:absolute;inset:0;display:block}.mobile .card a:focus-visible{outline:4px solid white;outline-offset:-5px}
}
</style></head><body>
