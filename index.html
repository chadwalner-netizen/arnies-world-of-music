<title>Arnie's World of Music</title><meta name="description" content="Arnie's guitar performances, music calendar, and video library.">
<style>
*{box-sizing:border-box}body{margin:0;background:#06101d;color:#fff;font-family:Georgia,serif}a{color:inherit}
.desktop{position:relative;max-width:1671px;margin:auto}.art{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;border-radius:8px;outline-offset:2px}.hotspot:hover{box-shadow:inset 0 0 0 3px #ffe08a88;background:#fff1}.hotspot:focus-visible{outline:3px solid #fff}
.mobile{display:none}.notice{font:13px/1.4 Arial,sans-serif;text-align:center;color:#c8b98b;padding:12px}
@media(max-width:760px){
.desktop{display:none}.mobile{display:block}.mobile header{background:#060d17;border-bottom:1px solid #d6a63e;text-align:center;padding:12px}
.mobile header img{width:100%;max-width:420px;display:block;margin:auto}.mobile nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px 8px;background:#0b1423}
.mobile nav a{font:600 13px Arial,sans-serif;text-decoration:none;padding:10px 9px;border:1px solid #bd943d;border-radius:5px}
.mobile .hero-image{width:100%;display:block}.mobile h1{text-align:center;color:#f6d27b;font-size:30px;line-height:1.1;margin:24px 14px 8px}
.mobile .tag{text-align:center;font-size:17px;line-height:1.5;padding:0 20px 14px}
.mobile .cta{display:block;margin:4px auto 24px;width:max-content;max-width:90%;background:linear-gradient(#ffe68c,#d9a424);padding:14px 24px;border-radius:7px;color:#090f19;text-decoration:none;font:bold 17px Arial}
.mobile h2{text-align:center;color:#f8d57d;font-size:26px;margin:24px 10px}
.mobile .cards{display:grid;gap:16px;padding:0 12px 30px}.mobile .card{position:relative;border:2px solid #e4b545;border-radius:16px;overflow:hidden}.mobile .card img{width:100%;display:block}.mobile .card a{position:absolute;inset:0;display:block}.mobile .card a:focus-visible{outline:4px solid white;outline-offset:-5px}
}
